    const myCount = fonctionFilter !== 'all' ? filteredActions.length : null;
    return (<div>
      <Card style={{ marginBottom: '24px' }}><div style={{ display: 'flex', gap: '16px', alignItems: 'center', flexWrap: 'wrap' }}><div><label style={{ display: 'block', fontSize: '12px', color: COLORS.warmGray, marginBottom: '6px', fontWeight: '600' }}>FILTRER PAR FONCTION</label><Select value={fonctionFilter} onChange={setFonctionFilter} options={FONCTIONS.map(f => ({ value: f.id, label: `${f.icon} ${f.label}` }))} style={{ minWidth: '250px' }} /></div>{myCount !== null && <Badge variant="primary">{myCount} action{myCount > 1 ? 's' : ''} vous concern{myCount > 1 ? 'ent' : 'e'}</Badge>}<div style={{ flex: 1 }} /><Button variant="secondary" icon="📥" onClick={() => { const headers = ['ID', 'Action', 'Domaine', 'Responsables', 'Échéance', 'Priorité', 'Statut', 'Commentaire']; const rows = filteredActions.map(a => [a.id, a.action, REFERENTIEL[a.domaine]?.nom || a.domaine, a.responsables.map(r => getFonctionLabel(r)).join(', '), new Date(a.echeance).toLocaleDateString('fr-FR'), a.priorite, a.statut, a.commentaire]); const csvContent = [headers, ...rows].map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(';')).join('\n'); const BOM = '\uFEFF'; const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `plan-actions-qpp-${new Date().toISOString().split('T')[0]}.csv`; link.click(); }}>Export Excel</Button><Button icon="➕" onClick={() => setNewAction({ domaine: 'GOUVERNANCE', action: '', responsables: [], echeance: '', priorite: 'Moyenne', statut: 'Non démarré', commentaire: '' })}>Nouvelle action</Button></div></Card>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '16px', marginBottom: '24px' }}>{[{ l: 'Total', v: filteredActions.length, c: COLORS.info }, { l: 'Terminées', v: filteredActions.filter(a => a.statut === 'Terminé').length, c: COLORS.success }, { l: 'En cours', v: filteredActions.filter(a => a.statut === 'En cours').length, c: COLORS.warning }, { l: 'En retard', v: filteredActions.filter(a => new Date(a.echeance) < new Date() && a.statut !== 'Terminé').length, c: COLORS.error }].map(s => (<Card key={s.l}><div style={{ textAlign: 'center' }}><div style={{ fontSize: '28px', fontWeight: '700', color: s.c }}>{s.v}</div><div style={{ fontSize: '13px', color: COLORS.warmGray }}>{s.l}</div></div></Card>))}</div>
      <Card><div style={{ display: 'grid', gap: '12px' }}>{sorted.length === 0 ? <div style={{ textAlign: 'center', padding: '40px', color: COLORS.warmGray }}>Aucune action pour cette fonction</div> : sorted.map(a => { const late = new Date(a.echeance) < new Date() && a.statut !== 'Terminé'; const dom = REFERENTIEL[a.domaine]; return (<div key={a.id} onClick={() => setEditAction(a)} style={{ padding: '16px 20px', borderRadius: '12px', cursor: 'pointer', backgroundColor: a.statut === 'Terminé' ? COLORS.successLight : late ? COLORS.errorLight : COLORS.background, border: `1px solid ${late ? COLORS.error : 'transparent'}` }}><div style={{ display: 'flex', alignItems: 'flex-start', gap: '16px' }}><span style={{ fontSize: '24px' }}>{dom?.icon}</span><div style={{ flex: 1 }}><div style={{ fontWeight: '600', fontSize: '15px', marginBottom: '6px' }}>{a.action}</div><div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '8px' }}><Badge variant={a.priorite === 'Critique' ? 'error' : a.priorite === 'Haute' ? 'warning' : 'info'} size="small">{a.priorite}</Badge><Badge size="small">{dom?.nom}</Badge></div><div style={{ fontSize: '13px', color: COLORS.warmGray }}>{a.responsables.map(r => `${getFonctionIcon(r)} ${getFonctionLabel(r)}`).join(', ')}</div>{a.commentaire && <div style={{ fontSize: '12px', color: COLORS.warmGray, marginTop: '6px', fontStyle: 'italic' }}>💬 {a.commentaire}</div>}</div><div style={{ textAlign: 'right', minWidth: '100px' }}><div style={{ fontSize: '14px', fontWeight: '600', color: late ? COLORS.error : COLORS.dark, marginBottom: '8px' }}>{new Date(a.echeance).toLocaleDateString('fr-FR')}</div><Select value={a.statut} onClick={(e) => e.stopPropagation()} onChange={(v) => setActions(prev => prev.map(x => x.id === a.id ? { ...x, statut: v } : x))} options={[{ value: 'Non démarré', label: '⬜ Non démarré' }, { value: 'En cours', label: '🔄 En cours' }, { value: 'Terminé', label: '✅ Terminé' }, { value: 'Bloqué', label: '🚫 Bloqué' }]} style={{ fontSize: '12px', minWidth: '130px' }} /></div></div></div>); })}</div></Card>
    </div>);
  };
  const tabs = [{ id: 'accueil', label: 'Accueil', icon: '🏠' }, { id: 'referentiel', label: 'Référentiel', icon: '📖' }, { id: 'actions', label: 'Plan d\'Actions', icon: '📋' }];
  return (<div style={{ minHeight: '100vh', backgroundColor: COLORS.background, fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif' }}>
    <header style={{ backgroundColor: COLORS.white, borderBottom: `1px solid ${COLORS.lightGray}`, padding: '16px 32px', position: 'sticky', top: 0, zIndex: 100 }}><div style={{ maxWidth: '1400px', margin: '0 auto', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}><div style={{ backgroundColor: COLORS.primary, color: COLORS.white, width: '48px', height: '48px', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold', fontSize: '20px' }}>B°</div><div><h1 style={{ margin: 0, fontSize: '20px', fontWeight: '700' }}>Charte QPP</h1><p style={{ margin: 0, fontSize: '13px', color: COLORS.warmGray }}>Compliance Tracker</p></div></div><div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}><Badge variant={stats.score >= 80 ? 'success' : stats.score >= 50 ? 'warning' : 'error'}>Score : {stats.score}%</Badge><Button variant="ghost" size="small" icon="❓" onClick={() => setShowHelp(true)}>Aide</Button></div></div></header>
    <nav style={{ backgroundColor: COLORS.white, borderBottom: `1px solid ${COLORS.lightGray}`, padding: '0 32px' }}><div style={{ maxWidth: '1400px', margin: '0 auto', display: 'flex', gap: '8px' }}>{tabs.map(t => (<button key={t.id} onClick={() => setTab(t.id)} style={{ padding: '16px 24px', border: 'none', background: 'none', cursor: 'pointer', fontSize: '15px', fontWeight: tab === t.id ? '600' : '400', color: tab === t.id ? COLORS.primary : COLORS.warmGray, borderBottom: tab === t.id ? `3px solid ${COLORS.primary}` : '3px solid transparent', display: 'flex', alignItems: 'center', gap: '8px', fontFamily: 'inherit' }}><span style={{ fontSize: '18px' }}>{t.icon}</span>{t.label}</button>))}</div></nav>
    <main style={{ maxWidth: '1400px', margin: '0 auto', padding: '32px' }}>{tab === 'accueil' && renderAccueil()}{tab === 'referentiel' && renderReferentiel()}{tab === 'actions' && renderActions()}</main>
    <footer style={{ backgroundColor: COLORS.white, borderTop: `1px solid ${COLORS.lightGray}`, padding: '20px 32px', textAlign: 'center' }}><div style={{ fontSize: '13px', color: COLORS.warmGray }}><strong style={{ color: COLORS.primary }}>BearingPoint</strong> © 2026 • Outil de conformité Charte QPP • Arrêté du 4 mars 2022</div></footer>
    <Modal isOpen={showHelp} onClose={() => setShowHelp(false)} title="Guide d'utilisation"><div style={{ display: 'grid', gap: '20px' }}><InfoBox type="info" title="Page Accueil">Vue d'ensemble de votre conformité. Sélectionnez votre fonction pour personnaliser.</InfoBox><InfoBox type="info" title="Page Référentiel">Explorez les 7 domaines. Chaque exigence contient des explications détaillées.</InfoBox><InfoBox type="info" title="Page Plan d'Actions">Suivez et mettez à jour vos actions. Filtrez par fonction.</InfoBox><InfoBox type="tip" title="Conseil">Commencez par "Gouvernance & Pilotage" - c'est le socle de votre démarche.</InfoBox><InfoBox type="warning" title="💾 Sauvegarde automatique">Vos modifications sont automatiquement sauvegardées dans ce navigateur.</InfoBox></div></Modal>
    {editAction && (<Modal isOpen={!!editAction} onClose={() => setEditAction(null)} title={editAction.action} subtitle={`Action ${editAction.id}`}><div style={{ display: 'grid', gap: '20px' }}><div><label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', fontSize: '14px' }}>Description</label><TextArea value={editAction.action} onChange={(v) => setEditAction({ ...editAction, action: v })} rows={2} /></div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}><div><label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', fontSize: '14px' }}>Échéance</label><Input type="date" value={editAction.echeance} onChange={(v) => setEditAction({ ...editAction, echeance: v })} /></div><div><label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', fontSize: '14px' }}>Priorité</label><Select value={editAction.priorite} onChange={(v) => setEditAction({ ...editAction, priorite: v })} options={[{ value: 'Critique', label: '🔴 Critique' }, { value: 'Haute', label: '🟠 Haute' }, { value: 'Moyenne', label: '🔵 Moyenne' }, { value: 'Basse', label: '⚪ Basse' }]} style={{ width: '100%' }} /></div></div><div><label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', fontSize: '14px' }}>Statut</label><Select value={editAction.statut} onChange={(v) => setEditAction({ ...editAction, statut: v })} options={[{ value: 'Non démarré', label: '⬜ Non démarré' }, { value: 'En cours', label: '🔄 En cours' }, { value: 'Terminé', label: '✅ Terminé' }, { value: 'Bloqué', label: '🚫 Bloqué' }]} style={{ width: '100%' }} /></div><div><label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', fontSize: '14px' }}>Commentaire</label><TextArea value={editAction.commentaire} onChange={(v) => setEditAction({ ...editAction, commentaire: v })} placeholder="Notes, blocages, avancement..." rows={3} /></div><div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', paddingTop: '12px', borderTop: `1px solid ${COLORS.lightGray}` }}><Button variant="secondary" onClick={() => setEditAction(null)}>Annuler</Button><Button onClick={() => { setActions(prev => prev.map(a => a.id === editAction.id ? editAction : a)); setEditAction(null); }}>Enregistrer</Button></div></div></Modal>)}
    {newAction && (<Modal isOpen={!!newAction} onClose={() => setNewAction(null)} title="Nouvelle action" subtitle="Ajouter une action au plan"><div style={{ display: 'grid', gap: '20px' }}><div><label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', fontSize: '14px' }}>Description de l'action *</label><TextArea value={newAction.action} onChange={(v) => setNewAction({ ...newAction, action: v })} placeholder="Décrivez l'action à réaliser..." rows={2} /></div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}><div><label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', fontSize: '14px' }}>Domaine *</label><Select value={newAction.domaine} onChange={(v) => setNewAction({ ...newAction, domaine: v })} options={Object.values(REFERENTIEL).map(d => ({ value: d.id, label: `${d.icon} ${d.nom}` }))} style={{ width: '100%' }} /></div><div><label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', fontSize: '14px' }}>Échéance *</label><Input type="date" value={newAction.echeance} onChange={(v) => setNewAction({ ...newAction, echeance: v })} /></div></div><div><label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', fontSize: '14px' }}>Fonctions responsables *</label><div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>{FONCTIONS.filter(f => f.id !== 'all').map(f => (<div key={f.id} onClick={() => setNewAction(prev => ({ ...prev, responsables: prev.responsables.includes(f.id) ? prev.responsables.filter(r => r !== f.id) : [...prev.responsables, f.id] }))} style={{ padding: '8px 12px', borderRadius: '8px', border: `2px solid ${newAction.responsables.includes(f.id) ? COLORS.primary : COLORS.lightGray}`, backgroundColor: newAction.responsables.includes(f.id) ? COLORS.errorLight : COLORS.white, cursor: 'pointer', fontSize: '13px', display: 'flex', alignItems: 'center', gap: '6px' }}><span>{f.icon}</span><span>{f.label}</span></div>))}</div></div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}><div><label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', fontSize: '14px' }}>Priorité</label><Select value={newAction.priorite} onChange={(v) => setNewAction({ ...newAction, priorite: v })} options={[{ value: 'Critique', label: '🔴 Critique' }, { value: 'Haute', label: '🟠 Haute' }, { value: 'Moyenne', label: '🔵 Moyenne' }, { value: 'Basse', label: '⚪ Basse' }]} style={{ width: '100%' }} /></div><div><label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', fontSize: '14px' }}>Statut</label><Select value={newAction.statut} onChange={(v) => setNewAction({ ...newAction, statut: v })} options={[{ value: 'Non démarré', label: '⬜ Non démarré' }, { value: 'En cours', label: '🔄 En cours' }, { value: 'Terminé', label: '✅ Terminé' }]} style={{ width: '100%' }} /></div></div><div><label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', fontSize: '14px' }}>Commentaire</label><TextArea value={newAction.commentaire} onChange={(v) => setNewAction({ ...newAction, commentaire: v })} placeholder="Notes optionnelles..." rows={2} /></div><div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', paddingTop: '12px', borderTop: `1px solid ${COLORS.lightGray}` }}><Button variant="secondary" onClick={() => setNewAction(null)}>Annuler</Button><Button disabled={!newAction.action || !newAction.echeance || newAction.responsables.length === 0} onClick={() => { const id = 'ACT-' + String(actions.length + 1).padStart(3, '0'); setActions(prev => [...prev, { ...newAction, id, exigenceId: '' }]); setNewAction(null); }}>Créer l'action</Button></div></div></Modal>)}
  </div>);
};
// App with Login
const App = () => {
  const [isAuthenticated, setIsAuthenticated] = useState(() => { try { return sessionStorage.getItem('qpp-auth') === 'true'; } catch(e) { return false; } });
  const handleLogin = () => { sessionStorage.setItem('qpp-auth', 'true'); setIsAuthenticated(true); };
  if (!isAuthenticated) return <LoginScreen onLogin={handleLogin} />;
  return <QPPComplianceTracker />;
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
